name: Build SEO pages

# Regenerates the keyword landing pages, guides, homepage "Popular searches" hub,
# sitemap.xml and llms.txt from tools/pages_content.py, then commits the result.
on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python3 tools/build_pages.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build SEO pages from tools/pages_content.py"
            git push
          fi
